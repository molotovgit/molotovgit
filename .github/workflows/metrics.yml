name: metrics

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      # NOTE: swap token to secrets.METRICS_TOKEN (a PAT with public_repo) to
      # unlock the languages + repository panels — GITHUB_TOKEN is scoped to
      # this repo only, so those sections render empty.
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: molotovgit
          filename: github-metrics.svg
          template: classic
          base: header, activity, community
          config_timezone: Asia/Tashkent
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          # empty calendar cells default to #ebedf0 (near-white) which glares
          # against a dark profile — use GitHub's own dark-mode cell colour
          extras_css: |
            [fill="#ebedf0"] { fill: #161b22; }
            :root { --color-calendar-graph-day-bg: #161b22; }
